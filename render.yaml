services:
  - type: web
    name: quotelink
    runtime: node
    plan: starter
    buildCommand: echo "No dependencies to install"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/quotelink.db
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: quotelink-data
      mountPath: /var/data
      sizeGB: 1
